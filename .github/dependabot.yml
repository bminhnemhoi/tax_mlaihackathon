version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Ghim 12.11.1: bản có prebuilt cho Node 22 Linux x64 trên Hostinger (deployment/HOSTINGER.md).
      - dependency-name: better-sqlite3
      # Nâng major cần PR riêng và kiểm chứng đầy đủ.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
