name: Đề xuất tính năng
description: Ý tưởng cải tiến quy tắc, quy trình hoặc trải nghiệm
title: "[Đề xuất] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề
      description: Ai gặp vấn đề (kế toán viên, KTT, CFO, kiểm toán), trong tình huống nào, hiện mất bao nhiêu công.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Hành vi mong muốn. Với quy tắc thuế, ghi căn cứ pháp lý và ngày hiệu lực.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Rủi ro kiểm soát
      description: Đề xuất này có làm hóa đơn đáng lẽ phải chuyển người lại được tự duyệt, hoặc nới lỏng thẩm quyền không?
  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc
