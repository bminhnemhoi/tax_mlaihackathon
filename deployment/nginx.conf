# Replace tax-referee.example.com and provision certificate with Certbot before enabling HTTPS.
limit_req_zone $binary_remote_addr zone=tax_api:10m rate=30r/m;
server {
  listen 80;
  server_name tax-referee.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name tax-referee.example.com;
  ssl_certificate /etc/letsencrypt/live/tax-referee.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tax-referee.example.com/privkey.pem;
  client_max_body_size 15m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    limit_req zone=tax_api burst=15 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
    proxy_buffering off;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
